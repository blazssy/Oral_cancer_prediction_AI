services:
  - type: web
    name: oral-cancer-api
    env: docker
    plan: free

  - type: web
    name: oral-cancer-frontend
    env: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: oral-cancer-api
          envVarKey: RENDER_EXTERNAL_URL
